<button
  [type]="type()"
  [class]="'ui-btn ui-btn--' + variant()"
  [class.ui-btn--loading]="loading()"
  [class.ui-btn--icon-only]="iconOnly()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel() ? (ariaLabel() | translate) : null"
  [attr.aria-busy]="loading() || null"
  [attr.aria-disabled]="isDisabled() || null"
  (click)="onClick($event)">
  @if (loading()) {
    <span class="ui-btn__spinner" aria-hidden="true"></span>
  }
  @if (icon() && !loading()) {
    <span class="ui-btn__icon" aria-hidden="true">{{ icon() }}</span>
  }
  @if (labelKey() && !iconOnly()) {
    <span class="ui-btn__label">{{ labelKey() | translate }}</span>
  }
</button>
