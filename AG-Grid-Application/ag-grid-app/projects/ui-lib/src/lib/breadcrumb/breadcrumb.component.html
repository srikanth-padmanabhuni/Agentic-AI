<nav class="ui-breadcrumb" [attr.aria-label]="ariaLabel() | translate">
  <ol class="ui-breadcrumb__list">
    @for (item of items(); track item.labelKey; let last = $last) {
      <li class="ui-breadcrumb__item">
        @if (item.route && !last) {
          <a class="ui-breadcrumb__link" [routerLink]="item.route">{{ item.labelKey | translate }}</a>
        } @else {
          <span class="ui-breadcrumb__current" [attr.aria-current]="last ? 'page' : null">{{ item.labelKey | translate }}</span>
        }
        @if (!last) {
          <span class="ui-breadcrumb__separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
