<div class="ui-search-bar">
  <svg class="ui-search-bar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="11" cy="11" r="8"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
  <input
    type="search"
    class="ui-search-bar__input"
    [value]="query()"
    [placeholder]="placeholderKey() | translate"
    [attr.aria-label]="ariaLabel() | translate"
    (input)="onInput($event)" />
  @if (query()) {
    <button
      type="button"
      class="ui-search-bar__clear"
      [attr.aria-label]="'ARIA.CLEAR_SEARCH' | translate"
      (click)="clear()">
      &times;
    </button>
  }
</div>
