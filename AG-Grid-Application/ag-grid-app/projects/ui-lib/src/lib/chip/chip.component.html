<span class="ui-chip" [class]="'ui-chip--' + color()">
  <span class="ui-chip__label">{{ labelKey() | translate }}</span>
  @if (removable()) {
    <button
      class="ui-chip__remove"
      type="button"
      [attr.aria-label]="'ARIA.REMOVE' | translate"
      (click)="onRemove($event)">
      &times;
    </button>
  }
</span>
