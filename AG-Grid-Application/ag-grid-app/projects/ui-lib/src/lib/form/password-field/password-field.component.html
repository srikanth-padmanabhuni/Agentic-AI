<div class="ui-password-field" [class.ui-password-field--error]="errors() && touched()">
  @if (label()) {
    <label class="ui-password-field__label" [attr.for]="'pw-' + label()">
      {{ label() | translate }}
      @if (required()) {
        <span class="ui-password-field__required" aria-hidden="true">*</span>
      }
    </label>
  }
  <div class="ui-password-field__wrapper">
    <input
      class="ui-password-field__input"
      [id]="'pw-' + label()"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [placeholder]="placeholder() ? (placeholder() | translate) : ''"
      [attr.aria-label]="ariaLabel() ? (ariaLabel() | translate) : null"
      [attr.aria-required]="required() || null"
      [attr.aria-invalid]="errors() && touched() ? 'true' : null"
      [disabled]="isDisabled()"
      autocomplete="current-password"
      (input)="onInput($event)"
      (blur)="onBlur()" />
    <button
      type="button"
      class="ui-password-field__toggle"
      [attr.aria-label]="(visible() ? 'ARIA.HIDE_PASSWORD' : 'ARIA.SHOW_PASSWORD') | translate"
      (click)="toggleVisibility()">
      @if (visible()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      }
    </button>
  </div>
  @if (errors() && touched()) {
    @for (key of errorKeys(); track key) {
      @if (errorMessages()[key]) {
        <span class="ui-password-field__error" role="alert">{{ errorMessages()[key] | translate }}</span>
      }
    }
  }
</div>
