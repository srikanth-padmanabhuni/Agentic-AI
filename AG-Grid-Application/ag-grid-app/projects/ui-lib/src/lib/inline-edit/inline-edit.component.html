@if (editing()) {
  <div class="ui-inline-edit ui-inline-edit--editing">
    <input
      class="ui-inline-edit__input"
      [value]="editValue()"
      [attr.aria-label]="ariaLabel() | translate"
      (input)="onInputChange($event)"
      (keydown)="onKeydown($event)"
      (blur)="save()" />
  </div>
} @else {
  <span
    class="ui-inline-edit"
    [class.ui-inline-edit--disabled]="isDisabled()"
    tabindex="0"
    role="button"
    [attr.aria-label]="ariaLabel() | translate"
    (click)="startEdit()"
    (keydown.enter)="startEdit()">
    <span class="ui-inline-edit__value">{{ value() || '—' }}</span>
    @if (!isDisabled()) {
      <svg class="ui-inline-edit__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    }
  </span>
}
