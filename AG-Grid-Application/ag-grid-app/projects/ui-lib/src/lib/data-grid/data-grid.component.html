<div
  class="ui-data-grid"
  [style.height]="domLayout() === 'normal' ? gridHeight() : 'auto'"
  role="grid"
  [attr.aria-label]="'UI_LIB.GRID.ARIA_LABEL' | translate">
  <ag-grid-angular
    class="ag-theme-alpine"
    [style.width]="'100%'"
    [style.height]="'100%'"
    [rowData]="rowData()"
    [columnDefs]="translatedColumnDefs()"
    [defaultColDef]="defaultColDef()"
    [pagination]="pagination()"
    [paginationPageSize]="paginationPageSize()"
    [paginationPageSizeSelector]="paginationPageSizeSelector()"
    [rowSelection]="rowSelection()"
    [localeText]="localeText"
    [quickFilterText]="quickFilterText()"
    [domLayout]="domLayout()"
    [animateRows]="true"
    [suppressCellFocus]="false"
    [ensureDomOrder]="true"
    [masterDetail]="masterDetail()"
    [detailCellRendererParams]="detailCellRendererParams()"
    [detailRowHeight]="detailRowHeight()"
    [detailRowAutoHeight]="detailRowAutoHeight()"
    [isRowMaster]="isRowMaster()"
    [keepDetailRows]="keepDetailRows()"
    [keepDetailRowsCount]="keepDetailRowsCount()"
    [embedFullWidthRows]="embedFullWidthRows()"
    [treeData]="treeData()"
    [getDataPath]="getDataPath()"
    [groupDefaultExpanded]="groupDefaultExpanded()"
    [autoGroupColumnDef]="autoGroupColumnDef()"
    (gridReady)="onGridReady($event)"
    (rowClicked)="onRowClicked($event)"
    (selectionChanged)="onSelectionChanged($event)"
    (sortChanged)="onSortChanged($event)"
    (firstDataRendered)="onFirstDataRendered($event)"
    (rowGroupOpened)="onRowGroupOpened($event)" />
</div>
