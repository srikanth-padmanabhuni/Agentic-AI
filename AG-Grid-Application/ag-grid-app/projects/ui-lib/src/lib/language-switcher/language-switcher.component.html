<div class="ui-language-switcher">
  <label class="ui-language-switcher__label" for="lang-select">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"></path>
    </svg>
    <span class="sr-only">{{ 'ARIA.LANGUAGE_SELECTOR' | translate }}</span>
  </label>
  <select
    id="lang-select"
    class="ui-language-switcher__select"
    [value]="currentLang"
    [attr.aria-label]="'ARIA.LANGUAGE_SELECTOR' | translate"
    (change)="switchLang($any($event.target).value)">
    @for (lang of languages; track lang.code) {
      <option [value]="lang.code" [selected]="lang.code === currentLang">{{ lang.labelKey | translate }}</option>
    }
  </select>
</div>
