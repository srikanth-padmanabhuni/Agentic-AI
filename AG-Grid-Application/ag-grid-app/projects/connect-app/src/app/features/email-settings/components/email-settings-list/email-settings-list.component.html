<section class="email-settings-list" [attr.aria-label]="'EMAIL_SETTINGS.TITLE' | translate">
  <div class="list-actions">
    <ui-button variant="secondary" size="sm" [labelKey]="'COMMON.RELOAD'" (clicked)="loadData()" />
  </div>

  <ui-data-grid
    [rowData]="settings()"
    [columnDefs]="colDefs"
    [gridHeight]="'calc(100vh - 170px)'"
  />
</section>
